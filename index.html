   NOVIDADES (v0.1.0):

<style>
    body { font-family: "Inter", system-ui, sans-serif; background: var(--paper); color: var(--ink); }
    /* v0.8.4 — rede de segurança contra rolagem lateral no mobile. Causa
       raiz de um caso real (Campanhas): uma linha com overflow-x-auto
       (os passos do wizard) dentro de um item de grid sem min-width:0
       forçava a PÁGINA inteira a crescer em vez de rolar só a linha.
       Corrigido com min-w-0 nos pontos certos (nav.js/parametros-
       campanhas.js), e esta regra global garante que, se acontecer de
       novo em qualquer tela nova, a página corta em vez de abrir barra
       de rolagem horizontal. */
    html, body { overflow-x: hidden; max-width: 100vw; }
    .hidden { display: none !important; }

    /* Padrão liga/desliga — DESIGN_SYSTEM_RAIZ_PATRIMONIO.md, seção 2 */
    .raiz-btn-toggle.ativo { background: var(--pine) !important; color: #fff !important; border-color: var(--pine) !important; }
    .raiz-btn-toggle svg.raiz-icone-toggle { width: 20px; height: 20px; }

    /* Indicador de validação inline — seção 5 */
    .raiz-indicador-inline:empty { height: 0; margin-top: 0; }

    /* v0.7.0 — shell sidebar (desktop, ≥900px) / bottom-nav (mobile),
       mais fiel ao protótipo aprovado. Sidebar fica escondida no mobile;
       bottom-nav fica escondida no desktop. Mesma lista de telas
       (GESTAO_TELAS, js/nav.js) alimenta as duas. */
    .gestao-shell { display: block; }
    .gestao-sidebar { display: none; }
    .gestao-mobile-nav {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
        display: flex; justify-content: space-around; background: #fff;
        border-top: 1px solid var(--line);
        padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .gestao-main { padding-bottom: 84px; min-width: 0; } /* espaço pra bottom-nav não cobrir conteúdo; min-width:0 evita grid item esticar a página */

    @media (min-width: 900px) {
        .gestao-shell { display: grid; grid-template-columns: 220px 1fr; align-items: start; }
        .gestao-sidebar {
            display: block; position: sticky; top: 0; height: 100vh;
            background: var(--pine-deep); padding: 20px 12px; overflow-y: auto;
        }
        .gestao-mobile-nav { display: none; }
        .gestao-main { padding-bottom: 20px; }
    }

    .gestao-nav-item {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 12px; border-radius: 10px; font-size: 13px; font-weight: 700;
        color: var(--sage); white-space: nowrap; flex: none; width: 100%;
        text-align: left;
    }
    .gestao-sidebar .gestao-nav-item { color: rgba(255,255,255,.65); margin-bottom: 2px; }
    .gestao-sidebar .gestao-nav-item.ativo { background: var(--pine-light); color: #fff; }
    .gestao-mobile-nav .gestao-nav-item {
        flex-direction: column; gap: 2px; padding: 8px 10px; width: auto; flex: 1 1 0;
        font-size: 10px; text-align: center;
    }
    .gestao-mobile-nav .gestao-nav-item.ativo { color: var(--brass); }
    .gestao-nav-icone { font-size: 16px; line-height: 1; }

    /* v0.9.0 — bottom-sheet "Mais" (Saúde/Suporte/Configurações no mobile) */
    .gestao-mais-sheet {
        position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,.48);
        display: flex; align-items: flex-end;
    }
    .gestao-mais-painel {
        width: 100%; background: #fff; border-radius: 20px 20px 0 0; padding: 18px;
        padding-bottom: calc(18px + env(safe-area-inset-bottom, 0));
    }
    .gestao-mais-item {
        display: flex; align-items: center; gap: 12px; width: 100%;
        padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 700;
        color: var(--ink); text-align: left;
    }
    .gestao-mais-item.ativo { background: var(--paper); color: var(--pine); }
    @media (min-width: 900px) { .gestao-mais-sheet { display: none !important; } }

    /* Ícone informativo (tooltip clicável) — Saúde/Financeiro/Comercial/Empresas */
    .gestao-info-icone {
        color: var(--sage); font-size: 12px; line-height: 1; cursor: pointer;
        border: none; background: none; padding: 0;
    }
    .gestao-info-popover {
        position: absolute; z-index: 30; top: 20px; left: 0; width: 240px;
        background: var(--ink); color: #fff; font-size: 11px; font-weight: 400;
        text-transform: none; letter-spacing: normal; padding: 10px 12px;
        border-radius: 10px; line-height: 1.4; box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }
</style>
</head>

    <!-- ===================== ÁREA DE LOGIN ===================== -->
    <div id="area-login" class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-sm rounded-2xl p-8 shadow-xl" style="background:var(--pine-deep)">
            <h1 class="text-2xl font-bold text-white mb-1">Raiz Gestão</h1>
            <p class="text-sm mb-1" style="color:var(--brass-light)">Painel interno · Raízes Tech</p>
            <p class="text-[10px] mb-6" style="color:var(--pine-light)" id="badge-versao-login"></p>

            <div class="space-y-3">
                <input type="email" id="login-email" placeholder="E-mail" autocomplete="username"
                    class="w-full p-4 rounded-xl text-white text-base"
                    style="background:var(--pine);border:1px solid var(--pine-light)">
                <input type="password" id="login-senha" placeholder="Senha" autocomplete="current-password"
                    onkeydown="if(event.key==='Enter') fazerLoginGestao();"
                    class="w-full p-4 rounded-xl text-white text-base"
                    style="background:var(--pine);border:1px solid var(--pine-light)">
                <button onclick="fazerLoginGestao()"
                    class="w-full text-white font-bold py-3.5 rounded-xl shadow transition active:scale-95"
                    style="background:var(--brass)">
                    Entrar
                </button>
                <p id="login-status" class="text-xs text-center min-h-[1rem]" style="color:var(--brass-light)"></p>
            </div>
        </div>
    </div>

    <!-- ===================== ÁREA LOGADA ===================== -->
    <div id="area-app" class="hidden min-h-screen">
        <header class="flex items-center justify-between px-5 py-4 shadow" style="background:var(--pine)">
            <h1 class="text-lg font-bold text-white">🧭 Raiz Gestão</h1>
            <div class="flex items-center gap-3">
                <span class="text-sm text-white/80" id="nome-pessoa-logada"></span>
                <span class="text-[10px] text-white/50" id="badge-versao-app"></span>
                <button onclick="fazerLogoutGestao()" class="text-xs font-bold px-3 py-1.5 rounded-lg text-white" style="background:var(--pine-light)">Sair</button>
            </div>
        </header>

        <!-- v0.7.0 — shell sidebar (desktop) / bottom-nav (mobile), mais fiel ao
             protótipo aprovado. Ambas as navs são montadas por gestaoNavInit()
             (js/nav.js) a partir da mesma lista GESTAO_TELAS. -->
        <div class="gestao-shell">
            <aside class="gestao-sidebar">
                <nav id="gestao-sidebar-nav"></nav>
            </aside>
            <main class="p-5 gestao-main" id="area-conteudo">
                <p class="text-sm" style="color:var(--sage)">Carregando...</p>
            </main>
        </div>

        <nav id="gestao-mobile-nav" class="gestao-mobile-nav"></nav>

        <!-- v0.9.0 — bottom-sheet do "Mais" (Saúde/Suporte/Configurações no
             mobile, pra bottom-nav nunca ter mais que 4+Mais itens). -->
        <div id="gestao-mais-sheet" class="gestao-mais-sheet hidden" onclick="if(event.target===this) gestaoFecharMais()">
            <div class="gestao-mais-painel">
                <div class="flex items-center justify-between mb-3">
                    <b class="text-sm" style="color:var(--ink)">Mais</b>
                    <button onclick="gestaoFecharMais()" class="text-xs font-bold px-3 py-1.5 rounded-lg border-2" style="border-color:var(--line)">Fechar</button>
                </div>
                <div id="gestao-mais-sheet-itens" class="space-y-1"></div>
            </div>
        </div>
    </div>

    <script src="js/supabase-client.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/telas/cockpit.js"></script>
    <script src="js/telas/empresas.js"></script>
    <script src="js/telas/comercial.js"></script>
    <script src="js/telas/financeiro.js"></script>
    <script src="js/telas/saude.js"></script>
    <script src="js/telas/parametros-master.js"></script>
    <script src="js/telas/parametros-campanhas.js"></script>
    <script src="js/telas/parametros-planos.js"></script>
    <script src="js/telas/parametros-perfis.js"></script>
    <script src="js/telas/bot-uso.js"></script>
    <script>
        window.addEventListener('load', function () {
            if (window.lucide) lucide.createIcons();

            document.getElementById('badge-versao-login').textContent = APP_VERSAO;
            document.getElementById('badge-versao-app').textContent = APP_VERSAO;

            // Registra o Service Worker — necessário em algumas versões do
            // Chrome/Android pra instalar de verdade (ícone próprio, tela
            // cheia), senão o Android cai no atalho genérico do navegador.
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(function (err) {
                    console.warn('Falha ao registrar service worker:', err.message);
                });
            }
        });
    </script>
